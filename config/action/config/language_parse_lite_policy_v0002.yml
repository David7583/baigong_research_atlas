policy:
  name: language_parse_lite
  version: v0002
  description: >
    Lightweight language parsing policy.
    Operates only on paths explicitly allowed by parse eligibility decisions.
    Produces structurally indexed text units with full source traceability and STRICT absolute coordinates.

input_constraints:
  accepted_decision: ALLOW
  required_fields:
    - asset_id
    - path
    - decision

segmentation:
  paragraph:
    enabled: true
    split_on_newline: true
    keep_empty: false

  sentence:
    enabled: true
    split_on_punctuation: ".?!。！？"

statistics:
  compute:
    - char_length
    - punct_count
  punct_definition:
    characters: ".,;:!?。！？"

output:
  unit_type: text_unit
