# ============================================================
# File: action_data_sql_schema_config_v0001.yml
# 中文名: 行动端数据四库 SQL 原生层 schema 配置
# Version: v0001
#
# 服务脚本: init_action_data_sql_schema_v0001.py
# 默认查找路径: config/action/init_schema/action_data_sql_schema_config_v0001.yml
#
# 说明
#   本文件把脚本内置默认值显式声明出来,使「表结构」这一事实
#   从代码隐式默认,提升为 config 显式声明(config 驱动 / 数据层为唯一权威)。
#
#   当前阶段:表结构与理解端 init_sql_schema_v0001 完全同构。
#   唯一区别是 db 文件路径(sql/action_data.db,而非理解端的 sql/data.db)。
#   各端的库会在各自演化中逐渐分化(仓库先建好,演化交给以后)。
#
# 重要:SQL 脚本对 tables / fields 是「整段替换」而非合并。
#   即:本文件一旦声明 tables / fields,就必须写全四张表与四组字段,
#   漏写任何一项都会丢失(不会回退到内置默认补齐)。
# ============================================================


# ------------------------------------------------------------
# 连接 / 数据库文件位置
# ------------------------------------------------------------
connection:
  sqlite:
    # 相对当前隔离工程 project root 解析
    # 与理解端 sql/data.db 平行,同目录下以文件名区分
    path: "sql/action_data.db"
    pragmas:
      journal_mode: "WAL"
      foreign_keys: true
      synchronous: "NORMAL"


# ------------------------------------------------------------
# 表名映射(config_key -> 实际表名)
# ------------------------------------------------------------
tables:
  concept: "concept_units"
  instance: "instance_units"
  attribute: "unit_attributes"
  run_log: "ingestion_run_log"


# ------------------------------------------------------------
# 字段名映射(逻辑名 -> 实际列名)
# 当前阶段逻辑名与实际列名一致;保留映射结构以备将来分化。
# ------------------------------------------------------------
fields:

  # 概念单元表:去重后的文本单元(语义/事实/关系三轴的事实锚点)
  concept:
    id: "unit_text_id"
    text: "unit_text"
    hash: "content_hash"
    first_seen_instance: "first_seen_instance_id"
    created_at: "created_at"
    schema_version: "schema_version"
    run_id: "run_id"

  # 实例单元表:概念单元的每一次具体出现(带定位信息)
  instance:
    id: "instance_id"
    concept_id: "unit_text_id"
    asset_id: "asset_id"
    path: "path"
    value_index: "value_index"
    segment_index: "segment_index"
    sentence_index: "sentence_index"
    char_start: "char_start"
    char_end: "char_end"
    content: "content"
    content_hash: "content_hash"
    created_at: "created_at"
    schema_version: "schema_version"
    run_id: "run_id"

  # 属性表:挂在 concept / instance 上的可演化属性(规范门只在理解端生效)
  attribute:
    id: "attr_id"
    object_type: "object_type"
    object_id: "object_id"
    attr_scope: "attr_scope"
    attr_key: "attr_key"
    attr_value: "attr_value"
    attr_type: "attr_type"
    attr_state: "attr_state"
    evidence_ref: "evidence_ref"
    created_at: "created_at"
    created_by: "created_by"
    run_id: "run_id"

  # 摄入运行日志:append-only,记录每次写入运行的指纹
  run_log:
    run_id: "run_id"
    script_name: "script_name"
    script_version: "script_version"
    started_at: "started_at"
    finished_at: "finished_at"
    input_hash: "input_hash"
    output_hash: "output_hash"
    error_summary: "error_summary"
    environment_fingerprint: "environment_fingerprint"
